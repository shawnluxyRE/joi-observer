version = 1
revision = 5
requires-python = ">=3.12"

[[package]]
name = "colorama"
version = "0.4.6"
source = { registry = ".pytest_cache/offline_wheels" }
wheels = [
    { path = "colorama-0.4.6-py2.py3-none-any.whl" },
]

[[package]]
name = "iniconfig"
version = "2.3.0"
source = { registry = ".pytest_cache/offline_wheels" }
wheels = [
    { path = "iniconfig-2.3.0-py3-none-any.whl" },
]

[[package]]
name = "joi-observer"
version = "0.1.0.dev0"
source = { editable = "." }
dependencies = [
    { name = "pyyaml" },
]

[package.optional-dependencies]
test = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "pytest", marker = "extra == 'test'", specifier = ">=8,<9" },
    { name = "pyyaml", specifier = ">=6.0,<7" },
]
provides-extras = ["test"]

[[package]]
name = "packaging"
version = "26.3"
source = { registry = ".pytest_cache/offline_wheels" }
wheels = [
    { path = "packaging-26.3-py3-none-any.whl" },
]

