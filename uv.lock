    { path = "pluggy-1.6.0-py3-none-any.whl" },
]

[[package]]
name = "pygments"
version = "2.21.0"
source = { registry = ".pytest_cache/offline_wheels" }
wheels = [
    { path = "pygments-2.21.0-py3-none-any.whl" },
]

[[package]]
name = "pytest"
version = "8.4.2"
source = { registry = ".pytest_cache/offline_wheels" }
dependencies = [
    { name = "colorama", marker = "sys_platform == 'win32'" },
    { name = "iniconfig" },
